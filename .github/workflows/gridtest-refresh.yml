name: gridtest weekly data refresh

on:
  schedule:
    # 매주 수요일 00:00 KST = 화요일 15:00 UTC
    - cron: '0 15 * * 2'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gridtest-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh all ticker data
        run: python gridtest/refresh_data.py
      - name: Commit updated prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gridtest/prices.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(gridtest): weekly data refresh ($(date -u +%Y-%m-%d))"
            git push
          fi

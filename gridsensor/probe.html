<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0">
<div id="o" style="font:14px monospace;white-space:pre"></div>
<div id="box" style="position:fixed;left:-9999px;top:0"></div>
<script>
const W=[320,360,375,390,414,430,460,480,500,520,545,546,560,580,600,640,672,700,701,720,735];
const box=document.getElementById('box');
let out=[];
function one(w){return new Promise(res=>{
  const f=document.createElement('iframe');
  f.style.cssText='width:'+w+'px;height:400px;border:0;display:block';
  f.src='https://ansojang.github.io/gridsensor/index.html?p='+Math.floor(Math.random()*1e9);
  f.onload=()=>{setTimeout(()=>{
    let h=0; try{h=f.contentDocument.documentElement.scrollHeight}catch(e){h=-1}
    res([w,h]); f.remove();
  },1400)};
  box.appendChild(f);
});}
(async()=>{for(const w of W){const r=await one(w);out.push(r[0]+':'+r[1]);document.getElementById('o').textContent=out.join('\n');}
 document.title='DONE';})();
</script></body></html>
